apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: cloudpulse

data:
  dashboard.yaml: |
    apiVersion: 1

    providers:
      - name: CloudPulse
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true

        options:
          path: /etc/grafana/provisioning/dashboards