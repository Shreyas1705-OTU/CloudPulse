apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: cloudpulse

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: "cloudpulse-backend"

        metrics_path: /metrics

        static_configs:
          - targets:
              - backend:8000